<section class="tz-section" id="realisaties" aria-labelledby="real-title">
  <div class="tz-container">
    <div class="tz-section-head">
      <div class="tz-section-head__text">
        <span class="tz-eyebrow tz-eyebrow--pill"><span class="tz-leaf"></span>Realisaties</span>
        <h2 class="t-h1" id="real-title">Ons werk in <span class="tz-accent-word">uw buurt</span></h2>
        <p class="t-lead">Echte tuinen, echte resultaten. Elke foto is een opdracht van TuinZorg DP.</p>
      </div>
    </div>
    <div class="tz-gallery-tools">
      <div class="tz-tags tz-tags--scroll" data-tz-filter="gallery-home" role="group" aria-label="Filter op dienst"><button class="tz-tag" type="button" value="" aria-pressed="true">Alles <span class="tz-tag__count">12</span></button><button class="tz-tag" type="button" value="Maaien" aria-pressed="false">Maaien <span class="tz-tag__count">1</span></button><button class="tz-tag" type="button" value="Gazon" aria-pressed="false">Gazon <span class="tz-tag__count">2</span></button><button class="tz-tag" type="button" value="Snoeien" aria-pressed="false">Snoeien <span class="tz-tag__count">3</span></button><button class="tz-tag" type="button" value="Lamellen" aria-pressed="false">Lamellen <span class="tz-tag__count">2</span></button><button class="tz-tag" type="button" value="Afboording" aria-pressed="false">Afboording <span class="tz-tag__count">2</span></button><button class="tz-tag" type="button" value="Materialen" aria-pressed="false">Materialen <span class="tz-tag__count">2</span></button></div>
    </div>
    <div class="tz-gallery" id="gallery-home" data-tz-gallery="lightbox-home">
    <button class="tz-shot" type="button" data-cat="Maaien" data-title="Ruim gazon, gestreept gemaaid" data-full="{{img:photos/client/maaien-gazon-ruim.jpg}}" aria-label="Foto vergroten: Ruim gazon, gestreept gemaaid">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Maaien</span>
      <span class="tz-media tz-media--3x4" style="display:block"><img src="{{img:photos/client/maaien-gazon-ruim.jpg}}" alt="Ruim gemaaid gazon met strepen achter een woning" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Ruim gazon, gestreept gemaaid</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Snoeien" data-title="Haag rond een ruim gazon" data-full="{{img:photos/client/haag-gazon-ruim.jpg}}" aria-label="Foto vergroten: Haag rond een ruim gazon">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Snoeien</span>
      <span class="tz-media tz-media--4x3" style="display:block"><img src="{{img:photos/client/haag-gazon-ruim.jpg}}" alt="Strak gesnoeide haag rond een ruim gazon onder een blauwe lucht" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Haag rond een ruim gazon</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Afboording" data-title="Gebogen border met afboording" data-full="{{img:photos/client/afboording-border-gebogen.jpg}}" aria-label="Foto vergroten: Gebogen border met afboording">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Afboording</span>
      <span class="tz-media tz-media--1x1" style="display:block"><img src="{{img:photos/client/afboording-border-gebogen.jpg}}" alt="Gebogen border met tuinafboording in een gazon voor een haag" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Gebogen border met afboording</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Lamellen" data-title="Lamellen met bijpassende poort" data-full="{{img:photos/client/lamellen-poort.jpg}}" aria-label="Foto vergroten: Lamellen met bijpassende poort">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Lamellen</span>
      <span class="tz-media tz-media--3x4" style="display:block"><img src="{{img:photos/client/lamellen-poort.jpg}}" alt="Antraciet lamellen gevlochten in een draadafsluiting met poort" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Lamellen met bijpassende poort</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Gazon" data-title="Voor en na: nieuwe grasmat" data-full="{{img:photos/client/grasmat-voor-na.jpg}}" aria-label="Foto vergroten: Voor en na: nieuwe grasmat">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Gazon</span>
      <span class="tz-media tz-media--2x3" style="display:block"><img src="{{img:photos/client/grasmat-voor-na.jpg}}" alt="Voor en na: een vermoeid gazon en dezelfde tuin met een nieuwe grasmat" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Voor en na: nieuwe grasmat</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Materialen" data-title="Voortuin in houtschors" data-full="{{img:photos/client/schors-voortuin.jpg}}" aria-label="Foto vergroten: Voortuin in houtschors">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Materialen</span>
      <span class="tz-media tz-media--4x3" style="display:block"><img src="{{img:photos/client/schors-voortuin.jpg}}" alt="Voortuin met vaste planten in een bed van houtschors" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Voortuin in houtschors</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Snoeien" data-title="Beukenhaag in de herfst" data-full="{{img:photos/client/haag-beuk-achtertuin.jpg}}" aria-label="Foto vergroten: Beukenhaag in de herfst">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Snoeien</span>
      <span class="tz-media tz-media--4x5" style="display:block"><img src="{{img:photos/client/haag-beuk-achtertuin.jpg}}" alt="Gesnoeide beukenhaag in een achtertuin in de herfst" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Beukenhaag in de herfst</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Gazon" data-title="Gazon geverticuteerd" data-full="{{img:photos/client/verticuteren-rijen.jpg}}" aria-label="Foto vergroten: Gazon geverticuteerd">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Gazon</span>
      <span class="tz-media tz-media--1x1" style="display:block"><img src="{{img:photos/client/verticuteren-rijen.jpg}}" alt="Geverticuteerd gazon met rijen opgeharkt materiaal" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Gazon geverticuteerd</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Afboording" data-title="Strakke rand voor het tuinhuis" data-full="{{img:photos/client/afboording-tuinhuis.jpg}}" aria-label="Foto vergroten: Strakke rand voor het tuinhuis">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Afboording</span>
      <span class="tz-media tz-media--3x4" style="display:block"><img src="{{img:photos/client/afboording-tuinhuis.jpg}}" alt="Rechte afboording met siergrassen voor een zwart tuinhuis" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Strakke rand voor het tuinhuis</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Materialen" data-title="Grindpad langs het tuinhuis" data-full="{{img:photos/client/grind-pad-tuinhuis.jpg}}" aria-label="Foto vergroten: Grindpad langs het tuinhuis">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Materialen</span>
      <span class="tz-media tz-media--4x5" style="display:block"><img src="{{img:photos/client/grind-pad-tuinhuis.jpg}}" alt="Wit grindpad langs een houten tuinhuis en het gazon" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Grindpad langs het tuinhuis</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Snoeien" data-title="Vormsnoei van taxuszuilen" data-full="{{img:photos/client/taxus-vormsnoei.jpg}}" aria-label="Foto vergroten: Vormsnoei van taxuszuilen">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Snoeien</span>
      <span class="tz-media tz-media--4x3" style="display:block"><img src="{{img:photos/client/taxus-vormsnoei.jpg}}" alt="Vormsnoei van taxuszuilen achter een betonnen brievenbus" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Vormsnoei van taxuszuilen</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    <button class="tz-shot" type="button" data-cat="Lamellen" data-title="Lamellen rond de containerplaats" data-full="{{img:photos/client/lamellen-containerplaats.jpg}}" aria-label="Foto vergroten: Lamellen rond de containerplaats">
      <span class="tz-badge tz-badge--glass tz-shot__badge">Lamellen</span>
      <span class="tz-media tz-media--1x1" style="display:block"><img src="{{img:photos/client/lamellen-containerplaats.jpg}}" alt="Lamellen in een draadafsluiting rond een containerplaats met grind" loading="lazy"></span>
      <span class="tz-shot__cap"><span>Lamellen rond de containerplaats</span><span class="tz-icon-chip">{{icon:maximize-2}}</span></span>
    </button>
    </div>
    <div class="tz-gallery__more"><a class="tz-btn tz-btn--secondary" href="/realisaties">Alle realisaties <span class="tz-btn__chip">{{icon:arrow-right}}</span></a></div>
    <dialog class="tz-lightbox" id="lightbox-home" aria-label="Foto">
      <img class="tz-lightbox__img" src="" alt="">
      <div class="tz-lightbox__bar">
        <div class="tz-lightbox__cap"><strong data-tz-cap></strong><span data-tz-capcat></span></div>
        <div class="tz-lightbox__nav">
          <button class="tz-btn tz-btn--light tz-btn--icon tz-btn--sm" type="button" data-tz-step="-1" aria-label="Vorige foto">{{icon:chevron-left}}</button>
          <button class="tz-btn tz-btn--light tz-btn--icon tz-btn--sm" type="button" data-tz-step="1" aria-label="Volgende foto">{{icon:chevron-right}}</button>
          <form method="dialog"><button class="tz-btn tz-btn--light tz-btn--icon tz-btn--sm" aria-label="Sluiten">{{icon:x}}</button></form>
        </div>
      </div>
    </dialog>

  </div>
</section>

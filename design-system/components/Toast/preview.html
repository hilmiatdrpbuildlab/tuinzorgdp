<!-- @dsCard group="Feedback" height=200 subtitle="Toasts on Light and Forest" -->
<div class="tz sg-stack">
  <div class="sg-row" data-theme="light"><div class="tz-toasts tz-toasts--static" aria-live="polite"><div class="tz-toast">{{icon:circle-check}}<span class="tz-toast__text">Bericht verstuurd. Wij antwoorden zo snel mogelijk.</span><button class="tz-alert__close" type="button" data-tz-dismiss aria-label="Sluiten">{{icon:x}}</button></div></div></div>
  <div class="sg-row" data-theme="forest"><div class="tz-toasts tz-toasts--static"><div class="tz-toast">{{icon:circle-check}}<span class="tz-toast__text">Link gekopieerd</span></div></div></div>
</div>

<!-- @dsCard group="Sections" height=1300 subtitle="Inset Forest hero card with score chip, two-tone headline, quote card and USPs; the split variant with side photos below" -->
<div class="tz" data-theme="light">
  {{partial:hero}}
  <div class="tz-section">
    <div class="tz-container">
      <section class="tz-hero tz-hero--split" aria-label="Hero, split variant">
        <div class="tz-hero__grid">
          <div class="tz-hero__copy">
            <span class="tz-eyebrow tz-eyebrow--pill"><span class="tz-leaf"></span>Tuinafboording</span>
            <h2 class="t-display" style="font-size: clamp(40px, 5vw, 64px)">Strakke randen, <span class="tz-accent-word">duurzaam</span> geplaatst</h2>
            <p class="t-lead">Een strakke scheiding tussen gazon, borders en paden, ook in cortenstaal.</p>
            <div class="tz-hero__actions"><a class="tz-btn" href="#">Offerte aanvragen <span class="tz-btn__chip">{{icon:arrow-right}}</span></a><a class="tz-btn tz-btn--outline" href="#">Bekijk realisaties</a></div>
          </div>
          <div class="tz-hero__photos">
            <div class="tz-media tz-media--3x4 tz-media--lg"><img src="{{img:photos/client/cortenstaal-border.jpg}}" alt="Gebogen border met cortenstalen afboording rond een terras" loading="lazy"></div>
            <div class="tz-media tz-media--4x3 tz-media--lg"><img src="{{img:photos/client/afboording-tuinhuis.jpg}}" alt="Rechte afboording met siergrassen voor een zwart tuinhuis" loading="lazy"></div>
            <div class="tz-media tz-media--4x3 tz-media--lg"><img src="{{img:photos/client/afboording-border-gebogen.jpg}}" alt="Gebogen border met tuinafboording in een gazon" loading="lazy"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: tuinzorgdp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuinzorgdp/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/sync-design-system.ts --check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # The build from the seed content (no database) must always pass, including verify-build.
      - run: npm run build
